name: Generate contribution snake

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  # Deliberately no push trigger: the snake is rendered from the contribution
  # graph, not from anything in this repo, so a content push tells it nothing.

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#0f9d58&color_dots=#e9edf1,#c6e9d6,#7fd6a9,#3aa76d,#0f5132
            dist/snake-dark.svg?palette=github-dark&color_snake=#35e08b

      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
